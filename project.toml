[input]
video = "C:/input_clips"
candidate_file = "C:/candidate_clips"

[output]
candidate_file = "C:/candidate_clips"
clips_dir = "C:/output_clips/"

[debug]
enabled = true
log_file = "./debug.log"

# Опциональные метрики кандидата (по умолчанию все false, если ключ отсутствует).
[metrics]
audio_median = true
audio_percentile = true
audio_stddev = true
audio_peak_density = true
audio_peak_duration = true
audio_entropy = true

motion_median = true
motion_percentile = true
motion_stddev = true
motion_peak_density = true
motion_peak_duration = true
motion_entropy = true

# Экспериментальные MediaPipe Pose метрики (backend = mediapipe_pose в config.toml).
[motion_analysis.mediapipe_pose_metrics]
enabled = true
pose_detection_ratio = true
avg_visible_landmarks = true
pose_visibility_score = true
landmark_dropout_ratio = true
pose_tracking_stability = true
upper_body_motion_score = true
lower_body_motion_score = true
torso_motion_score = true
head_motion_score = true
pose_motion_direction_variance = true
pose_motion_periodicity = true

[generate]

[selection]
mode = "filtered"  # filtered | review_all_scenes

[audio_analysis]
enabled = true

[cut]
