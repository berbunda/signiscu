[tools]
ffmpeg_path = "C:/ffmpeg/ffmpeg.exe"
ffprobe_path = "C:/ffmpeg/ffprobe.exe"

[general]
overwrite = true

[audio_analysis]
window_seconds = 5
threshold = 0.6
min_audio_coverage_ratio = 0.4
min_peak_score = 0.85
merge_gap_seconds = 7
padding_before_seconds = 5
padding_after_seconds = 5
min_clip_seconds = 8
max_clip_seconds = 90

[scene_detection]
enabled = true
threshold = 27.0
min_scene_seconds = 2.0
show_progress = true
max_scene_seconds = 30.0
