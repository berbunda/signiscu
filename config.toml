[tools]
ffmpeg_path = "C:/ffmpeg.exe"
ffprobe_path = "C:/ffprobe.exe"

[general]
overwrite = true

[audio_analysis]
window_seconds = 5
threshold = 0.6
min_audio_coverage_ratio = 0.4
min_peak_score = 0.85
merge_gap_seconds = 7
padding_before_seconds = 5
padding_after_seconds = 5
min_clip_seconds = 8
max_clip_seconds = 90

[scene_detection]
enabled = true
backend = "ffmpeg"  # pyscenedetect | ffmpeg
threshold = 27.0
min_scene_seconds = 2.0
show_progress = true
max_scene_seconds = 150.0
ffmpeg_scene_threshold = 0.30

[motion_analysis]
enabled = true
sample_fps = 2.0
resize_width = 320
residual_percentile = 85
motion_threshold = 0.4
min_motion_coverage_ratio = 0.3
min_motion_peak_score = 0.85
affect_selection = false
affect_score = false
weight_motion = 0.2
